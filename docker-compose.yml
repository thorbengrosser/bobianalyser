services:
  api:
    build: .
    container_name: bordbistro-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"   # Pangolin connects here; not exposed publicly.
    env_file: .env
    volumes:
      - ./data:/data            # db.sqlite + snapshots/ + img-cache/ live here.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  scraper:
    build: .
    container_name: bordbistro-scraper
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    # Scrape once on start (so a fresh deploy is never empty), then sleep until the
    # next 06:00 UTC — today's if still ahead, otherwise tomorrow's. No cron needed.
    command: >
      sh -c 'python scraper.py;
      while true; do
        now=$$(date -u +%s);
        next=$$(date -u -d "06:00" +%s);
        [ "$$next" -le "$$now" ] && next=$$(date -u -d "tomorrow 06:00" +%s);
        sleep $$((next - now));
        python scraper.py;
      done'
